<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VEO 3.1 // ykyky</title>
    <style>
        :root { --accent: #00e5ff; --bg: #050505; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Navigation */
        nav { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: #000; }
        .logo { font-weight: 900; color: var(--accent); letter-spacing: 2px; }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        
        .sidebar { width: 350px; background: #0a0a0a; border-right: 1px solid #222; padding: 25px; display: flex; flex-direction: column; gap: 20px; }
        
        textarea { 
            flex: 1; background: #000; border: 1px solid #333; border-radius: 12px; 
            color: var(--accent); padding: 15px; font-size: 14px; resize: none; outline: none;
        }
        
        .btn { padding: 15px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-gen { background: var(--accent); color: #000; }
        .btn-reset { background: transparent; color: #444; border: 1px solid #222; font-size: 11px; margin-top: 10px; }
        .btn-reset:hover { color: #ff4d4d; border-color: #ff4d4d; }

        .viewport { flex: 1; background: #000; display: flex; flex-direction: column; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo">VEO 3.1 // PROTOTYPE</div>
    <div style="font-size: 10px; color: #444;">SYSTEM: 2.2-A14B_VEO_HYBRID</div>
</nav>

<div class="workspace">
    <div class="sidebar">
        <label style="font-size: 11px; color: #666;">CINEMATIC PROMPT</label>
        <textarea id="pInput" placeholder="A futuristic spaceship landing in a jungle, neon lights, 4k..."></textarea>
        
        <button class="btn btn-gen" onclick="sendPrompt()">Generate Video</button>
        <button class="btn btn-reset" onclick="resetEngine()">Clear Session / Credits</button>
        
        <div style="font-size: 10px; color: #333; line-height: 1.4;">
            *Veo 3.1 is high-compute. If it hangs, try clearing cookies or using Incognito mode.
        </div>
    </div>

    <div class="viewport">
        <iframe id="engine" src="https://wan22t2v.puter.site/"></iframe>
    </div>
</div>

<script>
    const ENGINE_URL = "https://wan22t2v.puter.site/";

    function sendPrompt() {
        const val = document.getElementById('pInput').value;
        const frame = document.getElementById('engine').contentWindow;
        if (!val) return;
        frame.postMessage({ prompt: val }, ENGINE_URL);
    }

    function resetEngine() {
        // Refresh the iframe to reset the internal Puter state
        document.getElementById('engine').src = ENGINE_URL;
        console.log("Engine Reset Triggered.");
    }
</script>

</body>
</html>
