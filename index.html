<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SteveAI | Pro MVP</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #bef264; --bg: #0a0a0a; --panel: #141414; --border: #222; --text: #e2e8f0; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

        /* Premium Header */
        header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(10,10,10,0.8); backdrop-filter: blur(10px); z-index: 10; }
        .logo { font-weight: 800; color: var(--primary); letter-spacing: -1px; font-size: 20px; }
        .status { font-size: 11px; display: flex; align-items: center; gap: 8px; color: #666; font-weight: 600; }
        .dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 10px var(--primary); }

        /* Chat Area */
        #chat-flow { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 14px 20px; border-radius: 18px; font-size: 15px; line-height: 1.6; animation: slideUp 0.3s ease; }
        .user { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }

        /* Modern Input Area */
        #input-zone { padding: 20px; background: linear-gradient(to top, var(--bg), transparent); }
        .input-box { background: var(--panel); border: 1px solid var(--border); border-radius: 30px; display: flex; align-items: center; padding: 6px 15px; transition: 0.3s; }
        .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 20px rgba(190, 242, 100, 0.1); }
        input { flex: 1; background: transparent; border: none; color: white; padding: 12px; outline: none; font-size: 16px; }
        button#send { background: var(--primary); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-weight: bold; font-size: 18px; transition: 0.2s; }
        button#send:disabled { background: #333; color: #666; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <iframe id="puter-bridge" src="https://letscheck.puter.site/" style="display:none;"></iframe>

    <header>
        <div class="logo">STEVE AI.</div>
        <div class="status"><div class="dot"></div> CLAUDE 4.5 ULTRA</div>
    </header>

    <div id="chat-flow">
        <div class="msg ai">System ready, Saad. Claude 4.5 is live. No redirects, full memory enabled.</div>
    </div>

    <div id="input-zone">
        <div class="input-box">
            <input type="text" id="user-in" placeholder="Ask SteveAI anything..." onkeypress="if(event.key==='Enter') send()">
            <button id="send" onclick="send()">↑</button>
        </div>
    </div>

    <script>
        const bridge = document.getElementById('puter-bridge').contentWindow;
        const flow = document.getElementById('chat-flow');
        const btn = document.getElementById('send');
        let currentAiMsg = null;

        function send() {
            const val = document.getElementById('user-in').value.trim();
            if(!val) return;
            
            // Add user bubble
            appendBubble('user', val);
            document.getElementById('user-in').value = '';
            
            // Start thinking
            btn.disabled = true;
            btn.innerText = '...';
            currentAiMsg = appendBubble('ai', 'Connecting...');
            
            // Send to Puter
            bridge.postMessage({ prompt: val }, "https://letscheck.puter.site");
        }

        window.addEventListener("message", (e) => {
            if (e.origin !== "https://letscheck.puter.site") return;
            
            if (e.data.answer && currentAiMsg) {
                currentAiMsg.innerHTML = e.data.answer; // Markdown is rendered on the Puter side
                flow.scrollTop = flow.scrollHeight;
            }
            
            if (e.data.status === "done") {
                btn.disabled = false;
                btn.innerText = '↑';
            }
        });

        function appendBubble(role, text) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = text;
            flow.appendChild(div);
            flow.scrollTop = flow.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
