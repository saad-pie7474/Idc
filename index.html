<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEO 3.1 // GENERATOR</title>
    <style>
        :root { --accent: #00e5ff; --bg: #050505; --panel: #111111; --text: #ffffff; }
        
        body { 
            background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Top Navigation */
        nav { 
            width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; 
            align-items: center; border-bottom: 1px solid #222; box-sizing: border-box;
        }
        .brand { font-weight: 900; letter-spacing: 3px; color: var(--accent); }
        .model-badge { font-size: 10px; background: #222; padding: 4px 10px; border-radius: 20px; color: #888; border: 1px solid #333; }

        /* Main Layout */
        .app-container { 
            display: grid; grid-template-columns: 380px 1fr; gap: 30px; 
            width: 95%; max-width: 1400px; margin-top: 40px; height: 80vh;
        }

        /* Control Panel */
        .controls { 
            background: var(--panel); border: 1px solid #222; border-radius: 24px; 
            padding: 30px; display: flex; flex-direction: column; gap: 20px;
        }
        h2 { margin: 0; font-size: 18px; letter-spacing: 1px; }
        
        textarea { 
            width: 100%; height: 180px; background: #000; border: 1px solid #333; 
            border-radius: 16px; color: var(--accent); padding: 20px; box-sizing: border-box;
            font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1); }

        .generate-btn { 
            background: var(--accent); color: #000; border: none; padding: 18px; 
            border-radius: 14px; font-weight: 800; cursor: pointer; text-transform: uppercase;
            transition: 0.3s; box-shadow: 0 4px 20px rgba(0, 229, 255, 0.3);
        }
        .generate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0, 229, 255, 0.5); }

        /* Viewport Panel */
        .viewport { 
            background: #000; border: 1px solid #222; border-radius: 24px; 
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }
        .viewport-header { padding: 15px 25px; background: #111; border-bottom: 1px solid #222; font-size: 12px; color: #555; }
        
        #engineFrame { width: 100%; height: 100%; border: none; }

        @media (max-width: 900px) {
            .app-container { grid-template-columns: 1fr; height: auto; }
            #engineFrame { height: 400px; }
        }
    </style>
</head>
<body>

<nav>
    <div class="brand">WAN22T2V <span style="color:#fff;">//</span> YKYKY</div>
    <div class="model-badge">ENGINE: GOOGLE_VEO_3.1</div>
</nav>

<div class="app-container">
    <div class="controls">
        <h2>VIDEO GENERATOR</h2>
        <p style="font-size: 13px; color: #666; margin: 0;">Describe your cinematic vision. Veo 3.1 handles physics and lighting with high precision.</p>
        
        <textarea id="promptInput" placeholder="e.g. A fast-moving FPV drone shot through a futuristic canyon with glowing crystal formations..."></textarea>
        
        <button class="generate-btn" onclick="startGeneration()">Start Rendering</button>
        
        <div style="margin-top: auto; padding: 15px; background: #000; border-radius: 12px; font-size: 11px; color: #444;">
            STATUS: <span style="color: var(--accent);">STABLE</span><br>
            LATENCY: <span id="latency">--</span>ms
        </div>
    </div>

    <div class="viewport">
        <div class="viewport-header">SYSTEM_OUTPUT_STREAM</div>
        <iframe id="engineFrame" src="https://wan22t2v.puter.site/"></iframe>
    </div>
</div>

<script>
    const ENGINE_URL = "https://wan22t2v.puter.site/";

    function startGeneration() {
        const input = document.getElementById('promptInput');
        const frame = document.getElementById('engineFrame').contentWindow;
        
        if (!input.value.trim()) return;

        // Post data to your Puter engine
        const startTime = Date.now();
        frame.postMessage({ prompt: input.value }, ENGINE_URL);
        
        // Simple latency simulation for the UI
        document.getElementById('latency').innerText = Math.floor(Math.random() * 50) + 10;
        
        console.log("Veo 3.1 Prompt Sent...");
    }

    // Listener for messages back from the engine (if needed)
    window.addEventListener("message", (event) => {
        if (event.origin !== ENGINE_URL) return;
        // Handle completion signals here
    });
</script>

</body>
</html>
