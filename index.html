<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SteveAI | Pro Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #bef264; --bg: #050505; --panel: #111111; --border: #222; --text: #f8fafc; --glass: rgba(17, 17, 17, 0.8); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; display: flex; overflow: hidden; }

        /* Sidebar (MVP Style) */
        #sidebar { width: 260px; background: #000; border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: 0.3s; }
        @media (max-width: 768px) { #sidebar { display: none; } }

        /* Main Viewport */
        #viewport { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* Glass Header */
        header { padding: 18px 24px; border-bottom: 1px solid var(--border); background: var(--glass); backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .logo { font-weight: 800; color: var(--primary); font-size: 20px; letter-spacing: -1px; }
        .engine-badge { font-size: 10px; background: #222; padding: 4px 8px; border-radius: 6px; font-weight: 700; color: #888; border: 1px solid #333; }

        /* Chat Flow */
        #chat-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
        .msg { max-width: 85%; padding: 16px 20px; border-radius: 20px; font-size: 15px; line-height: 1.6; position: relative; }
        .user { align-self: flex-end; background: var(--primary); color: #000; font-weight: 600; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(190, 242, 100, 0.2); }
        .ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        
        /* Markdown / Math Styling in UI */
        .ai pre { background: #000 !important; border: 1px solid #333; border-radius: 10px; padding: 15px; margin: 10px 0; overflow-x: auto; }
        .ai code { font-family: 'Fira Code', monospace; font-size: 13.5px; color: var(--primary); }
        .ai blockquote { border-left: 3px solid var(--primary); margin: 0; padding-left: 15px; color: #94a3b8; }

        /* Premium Input Bar */
        #controls { padding: 20px; background: linear-gradient(to top, var(--bg) 80%, transparent); }
        .pill { background: var(--panel); border: 1px solid var(--border); border-radius: 40px; display: flex; align-items: center; padding: 8px 10px 8px 22px; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .pill:focus-within { border-color: var(--primary); box-shadow: 0 0 25px rgba(190, 242, 100, 0.15); }
        input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 16px; font-weight: 500; }
        #send-trigger { background: var(--primary); border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        #send-trigger:hover { transform: scale(1.05); filter: brightness(1.1); }
        #send-trigger:disabled { background: #333; opacity: 0.5; cursor: not-allowed; }

        /* The Ghost Bridge (Keeps JS active) */
        #bridge-container { position: absolute; width: 1px; height: 1px; opacity: 0.01; overflow: hidden; pointer-events: none; }
    </style>
</head>
<body>

    <div id="bridge-container">
        <iframe id="steve-brain" src="https://letscheck.puter.site/"></iframe>
    </div>

    <aside id="sidebar">
        <div style="padding:40px 30px;">
            <div style="color:var(--primary); font-size:12px; font-weight:800; letter-spacing:2px; margin-bottom:10px;">HISTORY</div>
            <div id="history-list" style="color:#444; font-size:13px;">Session memory active...</div>
        </div>
    </aside>

    <main id="viewport">
        <header>
            <div class="logo">STEVE AI</div>
            <div class="engine-badge">CLAUDE 4.5 PRO</div>
        </header>

        <div id="chat-flow">
            <div class="msg ai">Welcome back, Saad. System is connected to the Puter worker. How can I assist you today?</div>
        </div>

        <div id="controls">
            <div class="pill">
                <input type="text" id="user-query" placeholder="Type your prompt..." autocomplete="off" onkeypress="if(event.key==='Enter') exec()">
                <button id="send-trigger" onclick="exec()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        const brain = document.getElementById('steve-brain').contentWindow;
        const flow = document.getElementById('chat-flow');
        const btn = document.getElementById('send-trigger');
        let currentAiBubble = null;

        function exec() {
            const input = document.getElementById('user-query');
            const prompt = input.value.trim();
            if(!prompt) return;

            // UI feedback
            appendMsg('user', prompt);
            input.value = '';
            btn.disabled = true;
            
            // Create the AI placeholder
            currentAiBubble = appendMsg('ai', '<span style="color:#555">Thinking...</span>');
            
            // Send to Puter Bridge
            brain.postMessage({ prompt: prompt }, "https://letscheck.puter.site");
        }

        window.addEventListener("message", (e) => {
            // Verify origin for security
            if (e.origin !== "https://letscheck.puter.site") return;
            
            if (e.data.answer && currentAiBubble) {
                currentAiBubble.innerHTML = e.data.answer;
                flow.scrollTop = flow.scrollHeight;
            }
            
            if (e.data.status === "done") {
                btn.disabled = false;
                btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>`;
            }
        });

        function appendMsg(role, content) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerHTML = content;
            flow.appendChild(div);
            flow.scrollTop = flow.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
